default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (fix)
        entry: ruff check --fix
        language: system
        types: [python]
        stages: [pre-commit]
      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: system
        types: [python]
        stages: [pre-commit]
      - id: fast-tests
        name: fast tests
        entry: .venv/bin/pytest -m 'not integration'
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: typecheck
        name: ty
        entry: ty check src tests
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: full-check
        name: full check (including live DCSS)
        entry: poe check
        language: system
        pass_filenames: false
        stages: [pre-push]
