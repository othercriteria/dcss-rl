[project]
name = "dcss-rl"
version = "0.1.0"
description = "Reinforcement-learning agents for Dungeon Crawl Stone Soup"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
dependencies = [
  "gymnasium>=1.2,<2",
  "msgspec>=0.19,<1",
  "numpy>=2.2,<3",
  "pyyaml>=6,<7",
  "websockets>=15,<17",
]

[project.scripts]
dcss-rl = "dcss_rl.cli:main"

[dependency-groups]
dev = [
  "ty==0.0.31",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6,<8",
  "pytest-xdist>=3.8,<4",
]
# Install explicitly with `uv sync --group train`. Keeping this out of the
# default environment makes DCSS adapter work independent of CUDA/PyTorch.
train = [
  "accelerate>=1.10,<2",
  "safetensors>=0.6,<1",
  "torch>=2.8,<3",
  "transformers>=4.56,<6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dcss_rl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
markers = ["integration: exercises a locally built DCSS binary"]

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src", "tests"]
extend-exclude = [".cache", "artifacts", "checkpoints", "runs", "vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.poe]
executor.type = "simple"

[tool.poe.tasks]
test = ".venv/bin/pytest -m 'not integration'"
integration-test = ".venv/bin/pytest -m integration -n 3"
lint = "ruff check ."
format = "ruff format ."
format-check = "ruff format --check ."
check = ["test", "integration-test", "lint", "format-check", "typecheck"]
typecheck = "ty check src tests"
hooks = { shell = "pre-commit install --install-hooks && pre-commit install --hook-type pre-push" }
dcss-fetch = "scripts/fetch_dcss.sh"
dcss-build = "scripts/build_dcss.sh"
dcss-smoke = "scripts/smoke_dcss.sh"
compatibility-smoke = ".venv/bin/dcss-rl compatibility-smoke"
evaluate-scripted = ".venv/bin/dcss-rl evaluate-scripted --threshold configs/heldout-regression-v1.json"
evaluate-scripted-diagnostic = ".venv/bin/dcss-rl evaluate-scripted --suite configs/diagnostic-v1.json --champion artifacts/dev-champion.json"
watch-best = ".venv/bin/dcss-rl watch-best"
watch-dev-best = ".venv/bin/dcss-rl watch-best --champion artifacts/dev-champion.json"

[tool.ty.environment]
python-version = "3.13"
python-platform = "linux"

[tool.ty.src]
include = ["src", "tests"]
